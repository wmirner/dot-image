<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twins Avatar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <header class="brand">
      <h1>Twins Avatar</h1>
      <p>Turn a photo into a Twins avatar</p>
    </header>

    <section class="group">
      <h2>Image</h2>
      <div class="row">
        <button id="uploadBtn" class="btn primary">Upload image</button>
      </div>
      <p class="hint">…or drag &amp; drop / paste an image anywhere.</p>
      <input type="file" id="fileInput" accept="image/*" hidden>
    </section>

    <section class="group">
      <h2>Export</h2>
      <div class="row">
        <button id="exportPng" class="btn">Download PNG</button>
      </div>
      <p class="hint" id="exportStatus"></p>
    </section>
  </aside>

  <main class="stage" id="stage">
    <div class="brand-header">
      <span class="brand-prefix">Listen Labs /</span>
      <span class="brand-title"> Twins Avatar</span>
    </div>
    <span id="dotReadout">–</span>
    <button id="compareBtn" class="btn small">Hold to compare</button>
    <div class="canvas-wrap" id="canvasWrap">
      <div class="avatar-previews">
        <figure>
          <canvas class="avatar" data-size="160"></canvas>
          <figcaption>Profile</figcaption>
        </figure>
        <figure>
          <canvas class="avatar" data-size="48"></canvas>
          <figcaption>Post</figcaption>
        </figure>
        <figure>
          <canvas class="avatar" data-size="32"></canvas>
          <figcaption>Comment</figcaption>
        </figure>
      </div>
      <div class="drop-hint" id="dropHint">Drop an image here</div>
    </div>
  </main>

</div>
<script src="app.js?v=3"></script>
</body>
</html>
