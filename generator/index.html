<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twin Avatars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=28">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="sidebar-body">
      <h1>Listen Twins Avatar<br>Generator</h1>

      <section class="group">
        <h2>Seed</h2>
        <input type="text" id="seedInput" class="field" placeholder="Twin name, ID or #code" spellcheck="false" autocomplete="off">
        <div class="row">
          <button id="randomBtn" class="btn primary">Generate</button>
          <button id="copyCode" class="btn">Copy code</button>
        </div>
        <p class="hint">The same name or ID always gives the same avatar.</p>
      </section>

      <section class="group">
        <div class="group-head">
          <h2>Parts</h2>
          <button id="unlockAll" class="link">Reset all</button>
        </div>
        <div id="parts"></div>
        <p class="hint">Pick a part to lock it. Face shape, pose and lighting vary on their own.</p>
      </section>
    </div>

    <section class="sidebar-foot">
      <h2>Export</h2>
      <div class="row">
        <button id="exportPng" class="btn">PNG</button>
        <button id="exportSvg" class="btn">SVG</button>
      </div>
      <div class="row">
        <input type="number" id="setCount" class="field count" value="100" min="1" max="2000" aria-label="Set size">
        <button id="exportSet" class="btn">Download unique set</button>
      </div>
      <p class="hint" id="exportStatus">A .zip of SVGs and PNGs with a code list, no two alike.</p>
    </section>
  </aside>

  <main class="stage">
    <section class="hero">
      <button class="previews" id="copySvg" aria-label="Copy avatar SVG">
        <canvas class="avatar" data-size="160"></canvas>
        <canvas class="avatar" data-size="80"></canvas>
        <canvas class="avatar" data-size="40"></canvas>
      </button>
      <div class="code-wrap">
        <button class="code" id="codeLabel" aria-label="Copy avatar code">–</button>
        <span class="copied" id="copiedNote" role="status" aria-live="polite"></span>
      </div>
    </section>

    <div class="divider"></div>

    <section>
      <div class="gallery-head">
        <h2>Variations</h2>
        <button id="shuffleBtn" class="btn primary">Shuffle</button>
      </div>
      <div class="gallery" id="gallery"></div>
    </section>
  </main>

</div>
<div class="cursor-tip" id="cursorTip" aria-hidden="true">Copy SVG</div>
<script src="avatar.js?v=33"></script>
<script src="app.js?v=20"></script>
</body>
</html>
